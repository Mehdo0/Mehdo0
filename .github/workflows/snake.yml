name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake (amber phosphor palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ffb000&color_dots=#0b0f0d,#1b2f22,#2f6b3f,#4fae5c,#26ff6a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb000&color_dots=#0b0f0d,#1b2f22,#2f6b3f,#4fae5c,#26ff6a

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
