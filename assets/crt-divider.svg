<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" role="img" aria-label="CRT divider">
  <title>divider</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffb000" stop-opacity="0.75"/>
      <stop offset="82%" stop-color="#ffb000" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26ff6a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#26ff6a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#26ff6a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="12" width="1000" height="1.4" fill="url(#fade)"/>
  <rect x="0" y="11.4" width="200" height="2.8" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="translate" from="-220 0" to="1020 0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <g fill="#26ff6a" opacity="0.85">
    <rect x="6" y="9" width="7" height="7"><animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="987" y="9" width="7" height="7"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="ui-monospace, 'Courier New', monospace" font-size="9" fill="#26ff6a" opacity="0.5">
    <text x="22" y="21">42</text>
    <text x="968" y="21">RDY</text>
  </g>
</svg>
