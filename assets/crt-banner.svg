<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Mehdi Mouaffak — 42 Lausanne — CRT terminal banner">
  <title>Mehdi Mouaffak — 42 Lausanne</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1c05"/>
      <stop offset="45%" stop-color="#150e02"/>
      <stop offset="100%" stop-color="#0a0701"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#ffb000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c07"/>
      <stop offset="60%" stop-color="#050803"/>
      <stop offset="100%" stop-color="#0b0f06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hard" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000000" opacity="0.55"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#26ff6a" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <clipPath id="clipTitle"><rect x="70" y="118" width="470" height="42"><animate attributeName="width" values="0;470" begin="0.5s" dur="1.1s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clipSub"><rect x="70" y="172" width="700" height="30"><animate attributeName="width" values="0;700" begin="1.9s" dur="1.5s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clipTag"><rect x="70" y="214" width="620" height="26"><animate attributeName="width" values="0;620" begin="2.9s" dur="1.2s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clipFrame"><rect x="26" y="26" width="948" height="238" rx="16"/></clipPath>
  </defs>

  <!-- CRT body -->
  <rect x="0" y="0" width="1000" height="290" rx="22" fill="url(#bezel)"/>
  <rect x="6" y="6" width="988" height="278" rx="18" fill="none" stroke="#ffb000" stroke-opacity="0.35" stroke-width="2"/>

  <!-- screen -->
  <rect x="26" y="26" width="948" height="238" rx="16" fill="url(#screen)"/>
  <g clip-path="url(#clipFrame)">
    <rect x="26" y="26" width="948" height="238" fill="url(#grid)"/>

    <!-- matrix rain (green phosphor) -->
    <g font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#26ff6a" opacity="0.30">
      <g><text x="60" y="40">0</text><animateTransform attributeName="transform" type="translate" from="0 -260" to="0 250" dur="9s" repeatCount="indefinite"/></g>
      <g><text x="150" y="10">1</text><animateTransform attributeName="transform" type="translate" from="0 -240" to="0 250" dur="11.5s" repeatCount="indefinite"/></g>
      <g><text x="240" y="70">A</text><animateTransform attributeName="transform" type="translate" from="0 -250" to="0 250" dur="8.2s" repeatCount="indefinite"/></g>
      <g><text x="330" y="20">42</text><animateTransform attributeName="transform" type="translate" from="0 -230" to="0 250" dur="13s" repeatCount="indefinite"/></g>
      <g><text x="500" y="60">FF</text><animateTransform attributeName="transform" type="translate" from="0 -270" to="0 250" dur="10.4s" repeatCount="indefinite"/></g>
      <g><text x="620" y="15">0</text><animateTransform attributeName="transform" type="translate" from="0 -250" to="0 250" dur="12.2s" repeatCount="indefinite"/></g>
      <g><text x="720" y="55">&lt;/&gt;</text><animateTransform attributeName="transform" type="translate" from="0 -240" to="0 250" dur="9.6s" repeatCount="indefinite"/></g>
      <g><text x="830" y="25">RST</text><animateTransform attributeName="transform" type="translate" from="0 -260" to="0 250" dur="14s" repeatCount="indefinite"/></g>
      <g><text x="910" y="65">1</text><animateTransform attributeName="transform" type="translate" from="0 -235" to="0 250" dur="10.9s" repeatCount="indefinite"/></g>
      <g><text x="950" y="30">C</text><animateTransform attributeName="transform" type="translate" from="0 -250" to="0 250" dur="12.6s" repeatCount="indefinite"/></g>
    </g>

    <!-- HUD: retro gaming score line -->
    <g font-family="ui-monospace, 'Courier New', monospace" font-size="13" filter="url(#hard)">
      <text x="70" y="62" fill="#26ff6a" opacity="0.9">1UP</text>
      <text x="112" y="62" fill="#ffb000" opacity="0.95">HI-SCORE 42000</text>
      <text x="853" y="62" fill="#26ff6a" opacity="0.9">CREDIT 01</text>
      <circle cx="985" cy="57" r="5" fill="#ff3b1f">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- prompt + typed title -->
    <g font-family="ui-monospace, 'Courier New', monospace" filter="url(#soft)">
      <text x="70" y="100" font-size="15" fill="#26ff6a" opacity="0.85">root@42lausanne:~$ ./whoami --verbose</text>
      <text x="70" y="152" font-size="38" font-weight="700" fill="#ffb000" letter-spacing="1.5" clip-path="url(#clipTitle)">MEHDI MOUAFFAK</text>
      <text x="70" y="196" font-size="17" fill="#ffd479" clip-path="url(#clipSub)">&gt; C · CONCURRENCY · CYBERSECURITY · MACHINE LEARNING</text>
      <text x="70" y="234" font-size="15" fill="#26ff6a" clip-path="url(#clipTag)">&gt; 42 LAUSANNE — COMMON CORE COMPLETED — OPEN TO 6-MONTH INTERNSHIP</text>
    </g>

    <!-- blinking block cursor -->
    <rect x="800" y="220" width="11" height="17" fill="#26ff6a">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>

    <!-- pixel invaders -->
    <g fill="#26ff6a" opacity="0.75">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 14 0; 0 0" dur="2.6s" repeatCount="indefinite"/>
        <rect x="886" y="118" width="5" height="5"/><rect x="901" y="118" width="5" height="5"/>
        <rect x="891" y="123" width="5" height="5"/><rect x="896" y="123" width="5" height="5"/><rect x="901" y="123" width="5" height="5"/>
        <rect x="896" y="128" width="5" height="5"/>
        <rect x="891" y="133" width="5" height="5"/><rect x="901" y="133" width="5" height="5"/>
      </g>
      <g opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0 0; -10 0; 0 0" dur="3.4s" repeatCount="indefinite"/>
        <rect x="886" y="168" width="4" height="4"/><rect x="898" y="168" width="4" height="4"/>
        <rect x="890" y="172" width="4" height="4"/><rect x="894" y="172" width="4" height="4"/><rect x="898" y="172" width="4" height="4"/>
        <rect x="894" y="176" width="4" height="4"/>
      </g>
    </g>

    <!-- power LED reflection + screen glow -->
    <rect x="26" y="26" width="948" height="238" fill="url(#glow)"/>

    <!-- scanlines + travelling sweep + flicker -->
    <rect x="26" y="26" width="948" height="238" fill="url(#scan)" opacity="0.42"/>
    <rect x="26" y="0" width="948" height="34" fill="#ffb000" opacity="0.055">
      <animateTransform attributeName="transform" type="translate" from="0 -34" to="0 246" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="26" width="948" height="238" fill="#ffb000" opacity="0">
      <animate attributeName="opacity" values="0;0.035;0;0.02;0;0" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bezel marks -->
  <g font-family="ui-monospace, 'Courier New', monospace" font-size="11" fill="#ffb000" opacity="0.55">
    <text x="36" y="280">MODEL CRT-42</text>
    <text x="820" y="280">PHOSPHOR P3 · 60Hz</text>
  </g>
  <rect x="700" y="272" width="46" height="7" rx="3" fill="#ff3b1f" opacity="0.75">
    <animate attributeName="opacity" values="0.75;0.9;0.75" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="756" y="272" width="46" height="7" rx="3" fill="#26ff6a" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.85;0.6" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
